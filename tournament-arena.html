<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050508">
    <meta name="description" content="WRC 2026 Tournament Arena - Live Battles">
    <title>Arène | WRC 2026</title>
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://*.supabase.co;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https: blob:;
        media-src 'self' https://player.vimeo.com https://*.supabase.co blob:;
        connect-src 'self' https://*.supabase.co https://ycgasfujxycqmbmiedaw.supabase.co;
        frame-src https://player.vimeo.com;
    ">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Teko:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/wrc-core.css">
    <link rel="stylesheet" href="/wrc-layout.css">
    <link rel="stylesheet" href="/wrc-components.css">
    <link rel="stylesheet" href="/tournament-arena.css">
    <link rel="stylesheet" href="/tournament-arena-mobile.css">
</head>
<body>

<!-- Background -->
<div class="bg-video">
    <video autoplay loop muted playsinline>
        <source src="https://player.vimeo.com/external/517090025.sd.mp4?s=1d57f7247752e503348821045231792102142273&profile_id=164" type="video/mp4">
    </video>
</div>
<div class="bg-grid"></div>

<!-- Tournament Container -->
<div class="tournament-container">
    
    <!-- Header -->
    <header class="tournament-header">
        <div class="header-left">
            <div class="tournament-logo">🏆</div>
            <div class="tournament-info">
                <h1 class="tournament-title">WRC 2026</h1>
                <div class="tournament-subtitle" id="matchId">#MATCH_01</div>
            </div>
        </div>
        <div class="header-right">
            <div class="status-badge">
                <span class="status-dot live"></span>
                <span class="status-phase">WAITING</span>
            </div>
            <div class="status-timer">--:--</div>
        </div>
    </header>

    <!-- Main Arena -->
    <main class="arena-main">
        
        <!-- Fighters -->
        <div class="arena-fighters">
            
            <!-- Fighter A -->
            <div class="fighter-container fighter-left" id="fighterA">
                <div class="fighter-avatar-container">
                    <img class="fighter-avatar" id="avatarA" src="" alt="Fighter A">
                    <div class="fighter-status" id="statusA">WAITING</div>
                </div>
                <div class="fighter-info" id="fighterInfoA">
                    <div class="fighter-name">???</div>
                    <div class="fighter-country">???</div>
                </div>
                <div class="fighter-track" id="trackInfoA"></div>
            </div>

            <!-- VS Badge -->
            <div class="arena-vs">
                <div class="vs-badge">VS</div>
            </div>

            <!-- Fighter B -->
            <div class="fighter-container fighter-right" id="fighterB">
                <div class="fighter-avatar-container">
                    <img class="fighter-avatar" id="avatarB" src="" alt="Fighter B">
                    <div class="fighter-status" id="statusB">WAITING</div>
                </div>
                <div class="fighter-info" id="fighterInfoB">
                    <div class="fighter-name">???</div>
                    <div class="fighter-country">???</div>
                </div>
                <div class="fighter-track" id="trackInfoB"></div>
            </div>
        </div>

        <!-- Current Track Info -->
        <div class="current-track-info">
            <span class="track-label">En lecture:</span>
            <span class="track-title" id="currentTrackTitle">En attente...</span>
        </div>

        <!-- Progress Bar -->
        <div class="arena-progress">
            <div class="progress-track">
                <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
            </div>
            <div class="progress-times">
                <span class="time-current" id="currentTime">0:00</span>
                <span class="time-total" id="totalTime">0:00</span>
            </div>
        </div>

        <!-- Vote Section -->
        <div class="arena-voting">
            <div class="vote-bar-container">
                <div class="vote-bar-side side-a">
                    <div class="vote-bar" id="voteBarA" style="width: 50%;"></div>
                    <div class="vote-count" id="countA">0</div>
                    <div class="vote-percent" id="votePercentA">50%</div>
                </div>
                <div class="vote-bar-side side-b">
                    <div class="vote-bar" id="voteBarB" style="width: 50%;"></div>
                    <div class="vote-count" id="countB">0</div>
                    <div class="vote-percent" id="votePercentB">50%</div>
                </div>
            </div>
            
            <div class="vote-buttons">
                <button class="vote-btn vote-btn-a" id="btnA" disabled onclick="window.castVote('A')">
                    <span class="vote-btn-icon">🎵</span>
                    <span class="vote-btn-text">VOTER A</span>
                </button>
                <button class="vote-btn vote-btn-b" id="btnB" disabled onclick="window.castVote('B')">
                    <span class="vote-btn-icon">🎵</span>
                    <span class="vote-btn-text">VOTER B</span>
                </button>
            </div>
        </div>

        <!-- Audio Elements -->
        <audio id="audioA" preload="auto"></audio>
        <audio id="audioB" preload="auto"></audio>

    </main>

    <!-- Controls -->
    <footer class="arena-controls">
        <div class="control-group">
            <label class="control-label">Volume</label>
            <input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider">
            <span id="volumeValue" class="volume-value">80%</span>
            <button class="control-btn" id="muteBtn">🔊</button>
        </div>
        
        <div class="control-group control-group-right">
            <button class="control-btn" id="btnOpenBracketTree">📊 Tableau</button>
            <button class="control-btn" id="btnNextMatch" style="display: none;">Match suivant →</button>
        </div>
    </footer>

    <!-- Winner Overlay -->
    <div class="winner-overlay hidden" id="winnerOverlay">
        <div class="winner-content">
            <div class="winner-icon">🏆</div>
            <h2 class="winner-title">GAGNANT</h2>
            <div class="winner-name" id="winnerName">---</div>
            <div class="winner-track" id="winnerTrackTitle">---</div>
            <div class="winner-stats">
                <div class="winner-votes" id="winnerVotes">0</div>
                <div class="winner-percent" id="winnerPercent">0%</div>
            </div>
            <button class="winner-btn" id="btnNextMatchOverlay">Match suivant →</button>
        </div>
    </div>

</div>

<!-- Scripts - Modular Architecture -->
<script type="module">
    // Core modules
    import './src/js/auth/toast.js';
    import './src/js/auth/auth.js';
    import './src/js/components/nav.js';
    import './src/js/arena/index.js';
    import { logger } from './src/js/core/config.js';

    logger.info('Tournament Arena page loaded');
</script>

</body>
</html>
