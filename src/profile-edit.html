<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050508">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Mon Profil | WRC 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/wrc-core.css">
    <link rel="stylesheet" href="/css/wrc-layout.css">
    <link rel="stylesheet" href="/css/wrc-components.css">
</head>
<body>

<!-- Background -->
<div class="bg-video">
    <video autoplay loop muted playsinline>
        <source src="https://player.vimeo.com/external/517090025.sd.mp4?s=1d57f7247752e503348821045231792102142273&profile_id=164" type="video/mp4">
    </video>
</div>
<div class="bg-grid"></div>

<!-- App Container -->
<div class="wrc-app">
    
    <!-- Main Content -->
    <div class="wrc-main">
        <main class="wrc-content wrc-page" id="main-content">
            
            <!-- Header -->
            <section class="wrc-section">
                <div class="wrc-section-header">
                    <div>
                        <h1 class="wrc-section-title">Mon <span class="text-gradient">Profil</span></h1>
                        <p class="wrc-section-subtitle">Gérez vos informations</p>
                    </div>
                    <div class="wrc-section-actions">
                        <button class="btn btn-outline" id="btnLogout">Déconnexion</button>
                    </div>
                </div>
            </section>

            <div class="wrc-grid wrc-grid-3" style="align-items: start;">
                
                <!-- Profile Card -->
                <div class="glass-card elevated" style="text-align: center;">
                    <div style="width: 120px; height: 120px; margin: 0 auto var(--space-6); background: linear-gradient(135deg, var(--primary) 0%, var(--accent-pink) 100%); border-radius: var(--radius-2xl); display: flex; align-items: center; justify-content: center; font-size: 3rem; box-shadow: var(--glow-md);">
                        <span id="avatarDisplay">🎤</span>
                    </div>
                    <h2 style="font-family: var(--font-display); font-size: var(--text-2xl); margin-bottom: var(--space-2);" id="nameDisplay">
                        Artiste
                    </h2>
                    <span class="badge badge-primary" id="roleDisplay">Artiste</span>
                    
                    <div style="margin-top: var(--space-6); padding-top: var(--space-6); border-top: 1px solid var(--border-light);">
                        <div style="display: flex; justify-content: space-around; text-align: center;">
                            <div>
                                <div style="font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--weight-bold);" id="statTracks">0</div>
                                <div style="font-size: var(--text-xs); color: var(--text-muted);">MORCEAUX</div>
                            </div>
                            <div>
                                <div style="font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--weight-bold);" id="statVotes">0</div>
                                <div style="font-size: var(--text-xs); color: var(--text-muted);">VOTES</div>
                            </div>
                            <div>
                                <div style="font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--weight-bold);" id="statRank">-</div>
                                <div style="font-size: var(--text-xs); color: var(--text-muted);">RANG</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Edit Form -->
                <div class="glass-card" style="grid-column: span 2;">
                    <div class="glass-card-header">
                        <h3 class="glass-card-title">✏️ Modifier mes informations</h3>
                    </div>
                    
                    <form id="profileForm">
                        <div class="wrc-grid wrc-grid-2">
                            <div class="input-group">
                                <label class="input-label">NOM DE SCÈNE</label>
                                <input type="text" class="input" id="stageName" placeholder="Votre blase">
                            </div>
                            <div class="input-group">
                                <label class="input-label">EMAIL</label>
                                <input type="email" class="input" id="email" placeholder="email@example.com" disabled>
                            </div>
                        </div>
                        
                        <div class="wrc-grid wrc-grid-2">
                            <div class="input-group">
                                <label class="input-label">VILLE</label>
                                <input type="text" class="input" id="city" placeholder="Votre ville">
                            </div>
                            <div class="input-group">
                                <label class="input-label">PAYS</label>
                                <select class="input" id="country">
                                    <option value="FR">🇫🇷 France</option>
                                    <option value="BE">🇧🇪 Belgique</option>
                                    <option value="CH">🇨🇭 Suisse</option>
                                    <option value="CA">🇨🇦 Canada</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label class="input-label">BIO</label>
                            <textarea class="input" id="bio" placeholder="Parlez-nous de vous..." rows="4"></textarea>
                        </div>
                        
                        <div style="display: flex; gap: var(--space-4); margin-top: var(--space-6);">
                            <button type="submit" class="btn btn-primary">SAUVEGARDER</button>
                            <button type="button" class="btn btn-outline" id="btnCancel">ANNULER</button>
                        </div>
                    </form>
                </div>
                
            </div>

        </main>
    </div>
    
</div>

<!-- Scripts -->
<script type="module" src="/main.js"></script>
<script type="module" src="/main.js"></script>
<script type="module" src="/main.js"></script>
<script type="module" src="/js/core/supabaseClient.js"></script>
<script type="module" src="/js/profile-edit.js"></script>

</body>
</html>
